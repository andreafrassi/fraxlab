<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SandriniApp — Assistente Fantacalcio</title>
<style>
:root{
  --bg:#0a0c0f; --surface:#13161b; --surface2:#1b1f26; --surface3:#232833;
  --border:#282e37; --border2:#333b47;
  --text:#e8ebef; --muted:#8b93a0; --faint:#5b6371;
  --accent:#3b82f6; --accent2:#8b5cf6; --accent-soft:#1d2b45;
  --pos:#34d399; --warn:#f59e0b; --neg:#f87171;
  --P:#f59e0b; --D:#34d399; --C:#60a5fa; --A:#fb7185;
  --r8:8px; --r12:12px; --r16:16px; --nav-h:60px; font-synthesis:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));}
body.home{padding-bottom:0}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer} input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:6px}

.app{max-width:1120px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:40;background:rgba(10,12,15,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:-.02em;font-size:17px;flex:none;cursor:pointer}
.logo .mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px rgba(59,130,246,.4)}
.logo .mark svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}
.logo b{color:var(--accent2)}
.search{position:relative;flex:1;max-width:560px}
.search input{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);
  border-radius:999px;padding:10px 16px 10px 40px;min-height:42px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
.sresults{position:absolute;top:48px;left:0;right:0;background:var(--surface);border:1px solid var(--border2);
  border-radius:12px;overflow:hidden;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.sresults .pcard{border:none;border-radius:0;border-bottom:1px solid var(--border)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--warn),#fb923c);
  display:flex;align-items:center;justify-content:center;font-weight:750;font-size:14px;color:#3a2500;flex:none}
.backbtn{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border2);
  color:var(--muted);border-radius:9px;padding:6px 11px 6px 8px;font-size:13px;font-weight:600;flex:none}
.backbtn:hover{color:var(--text)} .backbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.topbar .spacer{flex:1}
.view{padding:16px}
@media(min-width:880px){
  body{padding-bottom:0}
  .shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  body.home .shell{grid-template-columns:1fr}
  .view{padding:24px 28px}
}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:rgba(15,18,23,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:stretch}
body.home .nav{display:none}
.nav button{background:none;border:none;color:var(--muted);flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:550;transition:color .15s;padding-top:6px}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9}
.nav button.on{color:var(--text)} .nav button.on svg{stroke:var(--accent)}
@media(min-width:880px){
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;gap:4px;
    border-top:none;border-right:1px solid var(--border);padding:20px 12px;background:var(--surface)}
  .nav .navbrand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:16px;padding:6px 10px 18px}
  .nav .navbrand .mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:11px;font-size:14px;padding:11px 12px;border-radius:10px;width:100%}
  .nav button.on{background:var(--surface2)}
}
.navbrand{display:none}
@media(max-width:879px){.desk-only{display:none}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r16);padding:16px}
.card+.card{margin-top:14px}
.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;font-weight:600}
.row{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid4{grid-template-columns:repeat(4,1fr)}}

.btn{background:var(--surface2);color:var(--text);border:1px solid var(--border2);border-radius:10px;
  padding:10px 15px;font-size:14px;font-weight:600;transition:background .15s,border-color .15s;min-height:42px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.btn:hover{background:var(--surface3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:#4f8ef7}
.btn.ghost{background:transparent}.btn.sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:8px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.iconbtn{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;width:34px;height:34px;
  display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--text);background:var(--surface3)}.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted);font-weight:550}
.input,select.input{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:10px;padding:11px 12px;width:100%;min-height:44px}
textarea.input{min-height:70px;resize:vertical;line-height:1.5}

.chip{display:inline-flex;align-items:center;justify-content:center;font-weight:750;font-size:11px;width:22px;height:22px;border-radius:6px;flex:none}
.chip.P{background:rgba(245,158,11,.16);color:var(--P)}.chip.D{background:rgba(52,211,153,.16);color:var(--D)}
.chip.C{background:rgba(96,165,250,.16);color:var(--C)}.chip.A{background:rgba(251,113,133,.16);color:var(--A)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.tag.gold{color:var(--warn);background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.25)}
.tag.green{color:var(--pos);background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.25)}
.tag.red{color:var(--neg);background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.25)}
.tag.blue{color:var(--C);background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.25)}
.tier{display:inline-flex;width:18px;height:18px;border-radius:5px;align-items:center;justify-content:center;font-size:10px;font-weight:750}
.tierA{background:rgba(52,211,153,.18);color:var(--pos)}.tierB{background:rgba(96,165,250,.18);color:var(--C)}
.tierC{background:rgba(245,158,11,.16);color:var(--warn)}.tierD{background:rgba(139,147,160,.16);color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--surface3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.bar.over>i{background:var(--neg)}.bar.ok>i{background:var(--pos)}
.stats{width:100%;border-collapse:collapse;font-size:13px}
.stats th,.stats td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--border)}
.stats th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.stats td:first-child,.stats th:first-child{text-align:left}

/* HERO + TILES */
.hero{position:relative;border-radius:20px;padding:26px 22px;margin-bottom:18px;overflow:hidden;
  background:linear-gradient(120deg,rgba(59,130,246,.22),rgba(139,92,246,.22));border:1px solid var(--border2)}
.hero h1{font-size:23px;margin-bottom:6px}
.hero p{color:var(--muted);margin:0 0 16px;max-width:460px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;
  transition:border-color .15s,background .15s;text-align:left}
.tile:hover{border-color:var(--border2);background:var(--surface2)}
.tile .ti{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.tile .ti svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.9}
.tile .tt{font-weight:650;font-size:15px}.tile .td{color:var(--muted);font-size:12.5px;margin-top:2px}
.ti.blue{background:linear-gradient(135deg,#3b82f6,#2563eb)}.ti.violet{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
.ti.green{background:linear-gradient(135deg,#34d399,#059669)}.ti.amber{background:linear-gradient(135deg,#f59e0b,#d97706)}

/* stepper */
.stepper{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.step{flex:1;min-width:82px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer;transition:.15s}
.step.on{border-color:var(--accent);background:var(--accent-soft)}
.step .sc{font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.step .sn{font-size:11px;color:var(--muted);margin-top:2px}

.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters .input{flex:1;min-width:120px}.filters select.input{flex:none;width:auto;min-width:104px}
.plist{display:flex;flex-direction:column;gap:8px}
.pcard{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;transition:.15s;cursor:pointer}
.pcard:hover{border-color:var(--border2);background:var(--surface2)}
.pcard .nm{font-weight:600;line-height:1.2}.pcard .mt{color:var(--muted);font-size:12px}.pcard .push{flex:1}
.pmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pname{font-weight:600;line-height:1.15;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pmeta{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px}
.statline{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.sp{font-size:10.5px;font-weight:600;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 6px;color:var(--muted)}
.sp b{color:var(--text);font-weight:700;margin-left:3px}
.sp svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.6;vertical-align:-1px;margin-right:3px;opacity:.85}
.pright{display:flex;flex-direction:column;align-items:flex-end;gap:3px;justify-content:center;flex:none}
.qt{font-weight:700}.spark{display:block}
.arrow{font-weight:700}.arrow.up{color:var(--pos)}.arrow.dn{color:var(--neg)}.arrow.fl{color:var(--muted)}.arrow.wv{color:var(--warn)}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(5,6,8,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center;padding:20px}}
.sheet{background:var(--surface);border:1px solid var(--border);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:18px 18px 26px}
@media(min-width:640px){.sheet{border-radius:18px}}
.sheet .grip{width:38px;height:4px;border-radius:99px;background:var(--border2);margin:0 auto 14px}
@media(min-width:640px){.sheet .grip{display:none}}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty svg{width:42px;height:42px;stroke:var(--faint);fill:none;stroke-width:1.5;margin-bottom:12px}
.kpi{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px}
.kpi .v{font-size:22px;font-weight:750;letter-spacing:-.02em}.kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
.pref{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0}
.list-clean li{margin:6px 0}
.slotline{display:flex;align-items:center;gap:10px;padding:9px 0}.slotline.ghost{opacity:.5}.slotline.empty-slot{opacity:.35}
.dot-ph{width:22px;height:22px;border-radius:6px;border:1px dashed var(--border2);flex:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" id="nav"></nav>
  <div class="app">
    <div class="topbar" id="topbar"></div>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="modalRoot"></div>

<script src="data.js"></script>
<script>
(function(){
"use strict";
const DATA=window.FANTA_DATA, PLAYERS=DATA.players, STRAT=DATA.strategia;
const byId={}; PLAYERS.forEach(p=>byId[p.id]=p);
const SEASONS=['23/24','24/25','25/26'], ROLES=['P','D','C','A'];
const ROLE_NAME={P:'Portieri',D:'Difensori',C:'Centrocampisti',A:'Attaccanti'};
const ROLE_ONE={P:'portiere',D:'difensore',C:'centrocampista',A:'attaccante'};
const ROSA=STRAT.rosa;

/* ---- persisted DB ---- */
const LS='fantaasta_v1';
let DB=loadDB();
function loadDB(){let r;try{r=JSON.parse(localStorage.getItem(LS));}catch(e){}
  if(r&&r.v===2&&r.auctions)return{v:2,auctions:r.auctions};
  if(r&&r.v===1&&r.auction){const a=Object.assign({id:'a'+Date.now(),name:'La mia asta',slots:r.slots||[],notes:r.notes||{},createdAt:Date.now()},r.auction);return{v:2,auctions:[a]};}
  return{v:2,auctions:[]};}
function save(){localStorage.setItem(LS,JSON.stringify(DB));}
/* ---- runtime nav ---- */
let R={currentId:null,home:'home',tab:'assistente',phase:'P',
  gf:{q:'',r:'',sq:'',sort:'qt'}, af:{q:'',sq:'',sort:'media3'}, search:''};
let _uid=Date.now();const uid=p=>p+(++_uid);

/* ---- helpers ---- */
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A=()=>DB.auctions.find(a=>a.id===R.currentId)||null;
const budget=()=>{const a=A();return a?a.budget:0;};
const crOf=(a,pct)=>Math.round(pct*a.budget);
const cr=pct=>{const a=A();return a?Math.round(pct*a.budget):0;};
const suggPct=p=>(p.qtA||1)/500;
const fm=(p,s)=>p.stats&&p.stats[s]?p.stats[s].fm:null;
const st25=(p,k)=>p.stats&&p.stats['25/26']?p.stats['25/26'][k]:null;
function media3(p){const v=SEASONS.map(s=>fm(p,s)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;}
const template=a=>STRAT.template_budget.find(t=>t.id===((a||A()).module))||STRAT.template_budget[1];
function trendMeta(t){switch(t){
  case'crescente':return{a:'↗',c:'up',l:'In crescita'};case'calante':return{a:'↘',c:'dn',l:'In calo'};
  case'stabile':return{a:'→',c:'fl',l:'Stabile'};case'altalenante':return{a:'↕',c:'wv',l:'Altalenante'};
  case'exploit singolo':return{a:'⚡',c:'wv',l:'Exploit singolo'};default:return{a:'·',c:'fl',l:'—'};}}
const FLAG={rigorista:{l:'Rigorista',c:'gold'},crescita:{l:'In crescita',c:'green'},calo:{l:'In calo',c:'red'},
  exploit:{l:'Exploit',c:'gold'},cc_offensivo:{l:'C offensivo',c:'blue'},poco_storico:{l:'Poco storico',c:''}};
const flagsHtml=p=>(p.flags||[]).map(f=>{const m=FLAG[f];return m?`<span class="tag ${m.c}">${m.l}</span>`:'';}).join('');
function spark(p){const vals=SEASONS.map(s=>fm(p,s)).filter(v=>v!=null);if(vals.length<2)return'';
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1,W=64,H=22,n=SEASONS.length;let d='',first=true,coords=[];
  SEASONS.forEach((s,idx)=>{const v=fm(p,s);if(v==null)return;const x=n>1?(idx/(n-1))*W:W/2,y=H-2-((v-mn)/rg)*(H-4);
    coords.push([x,y]);d+=(first?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ';first=false;});
  const last=coords[coords.length-1];const col=p.trend==='crescente'?'var(--pos)':p.trend==='calante'?'var(--neg)':'var(--muted)';
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.2" fill="${col}"/></svg>`;}
const tierBadge=t=>t?`<span class="tier tier${t}">${t}</span>`:'';
function seasonChart(p){
  const rows=SEASONS.map(s=>({s,fm:fm(p,s),mv:p.stats[s]?p.stats[s].mv:null}));
  const present=rows.filter(r=>r.fm!=null||r.mv!=null);
  if(present.length<1) return '';
  const all=[];present.forEach(r=>{if(r.fm!=null)all.push(r.fm);if(r.mv!=null)all.push(r.mv);});
  let mn=Math.floor(Math.min(...all)-0.3),mx=Math.ceil(Math.max(...all)+0.3);const rg=(mx-mn)||1;
  const W=320,H=150,padL=10,padR=10,padT=16,padB=22,iw=W-padL-padR,ih=H-padT-padB,n=SEASONS.length;
  const xp=i=>padL+(n>1?i/(n-1)*iw:iw/2),yp=v=>padT+ih-((v-mn)/rg)*ih;
  const grid=[0,.25,.5,.75,1].map(t=>{const y=(padT+t*ih).toFixed(1);return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#282e37" stroke-width="1"/>`;}).join('');
  function line(key,col,fillId){
    const pts=[];SEASONS.forEach((s,i)=>{const r=rows[i],v=r?r[key]:null;if(v==null)return;pts.push([xp(i),yp(v),v]);});
    if(!pts.length)return '';
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const dots=pts.map(pt=>`<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="3.2" fill="${col}"/><text x="${pt[0].toFixed(1)}" y="${(pt[1]-7).toFixed(1)}" fill="${col}" font-size="10" font-weight="700" text-anchor="middle">${pt[2].toFixed(2)}</text>`).join('');
    const area=fillId?`<path d="${d} L ${pts[pts.length-1][0].toFixed(1)} ${(padT+ih).toFixed(1)} L ${pts[0][0].toFixed(1)} ${(padT+ih).toFixed(1)} Z" fill="url(#${fillId})" opacity=".22"/>`:'';
    return area+`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>${dots}`;
  }
  const xl=SEASONS.map((s,i)=>`<text x="${xp(i).toFixed(1)}" y="${H-6}" fill="#8b93a0" font-size="10" text-anchor="middle">${s}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible">

    ${grid}${line('mv','#34d399')}${line('fm','#3b82f6','fmg')}${xl}</svg>`;
}

/* ---- slots ---- */
function slotOf(pid){const a=A();return a&&a.slots.find(sl=>sl.cand.some(c=>c.pid===pid));}
function addSlot(pid){const a=A(),p=byId[pid];if(!a||!p||slotOf(pid))return;a.slots.push({id:uid('s'),r:p.r,cand:[{pid,pct:suggPct(p),note:''}],esito:null});save();}
function addCand(sid,pid){const a=A(),sl=a&&a.slots.find(x=>x.id===sid);if(!sl||slotOf(pid))return;sl.cand.push({pid,pct:suggPct(byId[pid]),note:''});save();}
function removeCand(sid,pid){const a=A(),sl=a&&a.slots.find(x=>x.id===sid);if(!sl)return;sl.cand=sl.cand.filter(c=>c.pid!==pid);if(!sl.cand.length)a.slots=a.slots.filter(x=>x.id!==sid);save();}
function budgetStats(a){a=a||A();let speso=0,impegnato=0;const per={P:{pl:0,got:0},D:{pl:0,got:0},C:{pl:0,got:0},A:{pl:0,got:0}};
  a.slots.forEach(sl=>{const RR=per[sl.r];if(!RR)return;if(sl.esito){speso+=sl.esito.prezzo;RR.pl+=sl.esito.prezzo;RR.got++;}else{const v=crOf(a,sl.cand[0].pct);impegnato+=v;RR.pl+=v;}});
  return{b:a.budget,speso,impegnato,residuo:a.budget-speso,dopo:a.budget-speso-impegnato,per,got:per.P.got+per.D.got+per.C.got+per.A.got};}
function goalsAttesi(a){a=a||A();let g=0;a.slots.forEach(sl=>{if(sl.esito){const p=byId[sl.esito.pid];g+=(p&&st25(p,'gf'))||0;}});return g;}

    else { v.innerHTML=viewAssistente(); bindAssist(); }

function renderTop(){

/* ---- LISTONE (globale) ---- */
function sortArr(arr,s){arr.sort((a,b)=>{
  if(s==='qt')return(b.qtA||0)-(a.qtA||0); if(s==='fvm')return(b.fvm||0)-(a.fvm||0);
  if(s==='fm')return(fm(b,'25/26')||0)-(fm(a,'25/26')||0); if(s==='mv')return(st25(b,'mv')||0)-(st25(a,'mv')||0);
  if(s==='gf')return(st25(b,'gf')||0)-(st25(a,'gf')||0); if(s==='media3')return media3(b)-media3(a);
  if(s==='pv')return(st25(b,'pv')||0)-(st25(a,'pv')||0); if(s==='nome')return a.nome.localeCompare(b.nome);return 0;});return arr;}
const SORTS=[['qt','Quotazione'],['media3','Media 3 stagioni'],['fm','Fantamedia 25/26'],['mv','Media voto 25/26'],['gf','Gol 25/26'],['pv','Presenze 25/26'],['fvm','FVM'],['nome','Nome']];
function viewListone(){
  const f=R.gf,q=f.q.trim().toLowerCase();
  const teams=[...new Set(PLAYERS.map(p=>p.sq))].sort();
  let arr=PLAYERS.filter(p=>{if(f.r&&p.r!==f.r)return false;if(f.sq&&p.sq!==f.sq)return false;
    if(q&&!(p.nome.toLowerCase().includes(q)||p.sq.toLowerCase().includes(q)))return false;return true;});
  sortArr(arr,f.sort);
  return `<div class="between" style="margin-bottom:14px"><h1 style="font-size:20px">Listone</h1><button class="backbtn" data-act="home">${IC.back} Home</button></div>
  <div class="filters">

    <select class="input" id="lr"><option value="">Ruolo</option>${ROLES.map(r=>`<option value="${r}" ${f.r===r?'selected':''}>${r}</option>`).join('')}</select>
    <select class="input" id="lsq"><option value="">Squadra</option>${teams.map(t=>`<option ${f.sq===t?'selected':''}>${t}</option>`).join('')}</select>
    <select class="input" id="lsort">${SORTS.map(([k,l])=>`<option value="${k}" ${f.sort===k?'selected':''}>${l}</option>`).join('')}</select>
  </div>
  <div class="muted small" style="margin:-4px 0 8px">${arr.length} giocatori</div>
  <div class="plist">${arr.map(p=>previewCard(p)).join('')}</div>`;
}
function previewCard(p){
  const tm=trendMeta(p.trend);
  const mv=st25(p,'mv'),f=fm(p,'25/26'),pv=st25(p,'pv'),isP=p.r==='P';
  const inA=!!A(),inSlot=inA&&slotOf(p.id);
  const val=inA?cr(suggPct(p)):p.qtA,vlab=inA?'consigl.':'qt';
  const sp=(ic,l,v)=>(v==null||v==='')?'':`<span class="sp" title="${l}">${SIC[ic]||''}${l}<b>${v}</b></span>`;
  const c1=isP?sp('gs','GS',st25(p,'gs')):sp('gf','G',st25(p,'gf'));
  const c2=isP?sp('rp','Rp',st25(p,'rp')):sp('ass','A',st25(p,'ass'));
  const stats=[sp('eta','Età',p.age),sp('mv','MV',mv!=null?mv.toFixed(2):null),sp('fm','FM',f!=null?f.toFixed(2):null),
    c1,c2,sp('pr','Pr',pv)].join('');
  const tier=p.tiers['25/26']?tierBadge(p.tiers['25/26']):'';
  return `<div class="pcard" data-open="${p.id}"><span class="chip ${p.r}">${p.r}</span>

      ${p.flags.includes('rigorista')?'<span class="tag gold" style="padding:1px 6px">rig</span>':''}</div>
      <div class="pmeta">${esc(p.sq)}${tier?' · '+tier:''}</div>
      <div class="statline">${stats}</div></div>
    <div class="pright">${spark(p)}<div style="text-align:right"><div class="qt num" style="${inA?'color:var(--accent)':''}">${val}</div><div class="faint small">${vlab}</div></div></div>
    ${inA?`<button class="iconbtn" data-add="${p.id}" ${inSlot?'style="color:var(--accent);border-color:var(--accent)"':''} title="${inSlot?'Già salvato':'Salva'}">${IC.plus}</button>`:''}</div>`;
}
function bindListone(){
  const q=$('#lq');if(q)q.addEventListener('input',e=>{R.gf.q=e.target.value;render();setTimeout(()=>{const el=$('#lq');if(el){el.focus();el.selectionStart=el.value.length;}});});

/* ---- slot card (shared) ---- */
function slotCard(sl){
  const resolved=!!sl.esito;
  const rows=sl.cand.map((c,i)=>{const p=byId[c.pid];if(!p)return'';const got=resolved&&sl.esito.pid===c.pid;
    const credits=cr(c.pct),pctTxt=(c.pct*100).toFixed(1);const ord=['Preferito','2ª scelta','3ª scelta','4ª scelta'][i]||((i+1)+'ª');
    return `<div class="between" style="padding:8px 0;${i>0?'border-top:1px solid var(--border)':''};${resolved&&!got?'opacity:.4':''}">
      <div class="row" style="min-width:0"><span class="chip ${p.r}">${p.r}</span>
        <div style="min-width:0"><div class="nm" style="font-weight:600"><span class="pref">${ord}</span> ${esc(p.nome)} ${got?'<span class="tag green">PRESO</span>':''}</div>
          <div class="mt muted small">${esc(p.sq)} · qt ${p.qtA} · FM ${fm(p,'25/26')!=null?fm(p,'25/26').toFixed(2):'—'}</div></div></div>
      ${resolved?(got?`<div style="text-align:right"><div class="num" style="font-weight:750">${sl.esito.prezzo}</div><div class="faint small">pagato</div></div>`:''):
        `<div class="row" style="gap:6px"><div style="text-align:right">
          <input class="input num" style="width:62px;padding:7px 8px;min-height:36px;text-align:right" type="number" min="0" value="${credits}" data-price="${sl.id}|${c.pid}">
          <div class="faint small">${pctTxt}%</div></div>
          <button class="iconbtn" data-sugg="${sl.id}|${c.pid}" title="Consigliato (${cr(suggPct(p))})"><svg viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M6 6l1.4 1.4M16.6 16.6L18 18M18 6l-1.4 1.4M7.4 16.6L6 18"/><circle cx="12" cy="12" r="3.4"/></svg></button>
          <button class="iconbtn" data-buy="${sl.id}|${c.pid}" title="Segna preso"><svg viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M20 6L9 17l-5-5"/></svg></button>
          <button class="iconbtn" data-rmcand="${sl.id}|${c.pid}" title="Rimuovi">${IC.close}</button></div>`}
    </div>`;}).join('');
  return `<div class="card" style="padding:12px 14px;margin-bottom:10px">${rows}
    ${resolved?`<button class="btn ghost sm" data-undo="${sl.id}" style="margin-top:8px">Annulla acquisto</button>`
      :`<button class="btn ghost sm" data-addcand="${sl.id}" style="margin-top:8px">${IC.plus} 2ª / 3ª scelta</button>`}</div>`;
}

/* ---- SQUADRA ---- */
function viewSquadra(){
  const a=A(),bs=budgetStats(a);
  let html=`<div class="between" style="margin-bottom:14px"><h1 style="font-size:20px">La tua squadra</h1>
    <span class="tag ${bs.got===25?'green':''}">${bs.got}/25 presi</span></div>
    <div class="card" style="margin-bottom:14px"><div class="row" style="gap:18px">
      <div><div class="num" style="font-weight:750;font-size:18px">${bs.speso}</div><div class="faint small">speso</div></div>
      <div><div class="num" style="font-weight:750;font-size:18px;color:${bs.residuo<0?'var(--neg)':'var(--text)'}">${bs.residuo}</div><div class="faint small">residuo</div></div>
      <div><div class="num" style="font-weight:750;font-size:18px">${goalsAttesi(a)}</div><div class="faint small">gol attesi</div></div></div></div>`;
  ROLES.forEach(Rr=>{const slots=a.slots.filter(s=>s.r===Rr);const presi=slots.filter(s=>s.esito),plan=slots.filter(s=>!s.esito);
    html+=`<div class="between" style="margin:16px 0 8px"><h2 style="font-size:15px"><span class="chip ${Rr}">${Rr}</span> ${ROLE_NAME[Rr]}</h2>
      <span class="small num ${presi.length>=ROSA[Rr]?'':'muted'}" style="${presi.length>=ROSA[Rr]?'color:var(--pos)':''}">${presi.length}/${ROSA[Rr]}</span></div>`;
    const lines=[];
    presi.forEach(sl=>{const p=byId[sl.esito.pid];lines.push(`<div class="slotline"><span class="chip ${Rr}">${Rr}</span>
      <div style="min-width:0"><div class="nm" style="font-weight:600">${esc(p.nome)}</div><div class="mt muted small">${esc(p.sq)}</div></div>
      <div class="push" style="flex:1"></div><div style="text-align:right"><div class="num" style="font-weight:700">${sl.esito.prezzo}</div><div class="faint small">pagato</div></div></div>`);});
    plan.forEach(sl=>{const p=byId[sl.cand[0].pid];lines.push(`<div class="slotline ghost"><span class="chip ${Rr}">${Rr}</span>
      <div style="min-width:0"><div class="nm" style="font-weight:600">${esc(p.nome)} <span class="pref">obiettivo</span></div><div class="mt muted small">${esc(p.sq)}${sl.cand.length>1?' · +'+(sl.cand.length-1)+' alt.':''}</div></div>
      <div class="push" style="flex:1"></div><div style="text-align:right"><div class="num muted">${cr(sl.cand[0].pct)}</div><div class="faint small">target</div></div></div>`);});
    const filled=presi.length+plan.length;for(let i=filled;i<ROSA[Rr];i++)lines.push(`<div class="slotline empty-slot"><span class="dot-ph"></span><span class="muted small">slot libero</span></div>`);
    html+=`<div class="card" style="padding:6px 14px">${lines.join('<hr class="sep" style="margin:0">')}</div>`;});
  return html;
}

/* ---- RIEPILOGO ---- */
function viewRiepilogo(){
  const a=A(),t=template(a),bs=budgetStats(a),b=bs.b;
  const kpi=(v,l,c)=>`<div class="kpi"><div class="v num" ${c?`style="color:${c}"`:''}>${v}</div><div class="l">${l}</div></div>`;
  const split=ROLES.map(Rr=>{const tg=Math.round(t.ripartizione_pct[Rr]*b),pl=bs.per[Rr].pl,pct=tg?Math.min(100,Math.round(pl/tg*100)):0,over=pl>tg;
    return `<div style="margin:10px 0"><div class="between small"><span><span class="chip ${Rr}">${Rr}</span> ${ROLE_NAME[Rr]}</span>
      <span class="num" style="${over?'color:var(--neg)':'color:var(--muted)'}">${pl} / ${tg}</span></div>
      <div class="bar ${over?'over':''}" style="margin-top:5px"><i style="width:${pct}%"></i></div></div>`;}).join('');
  const goals=goalsAttesi(a);
  return `<div class="between" style="margin-bottom:16px"><div><h1 style="font-size:20px">${esc(a.name)}</h1>
    <div class="muted small">${a.participants} partecipanti · ${b} mln · ${esc(t.nome)}</div></div>
    <button class="btn sm" data-act="edit-auction">${IC.edit} Impostazioni</button></div>
  <div class="grid4" style="margin-bottom:14px">${kpi(bs.speso,'Speso')}${kpi(bs.impegnato,'Impegnato')}${kpi(bs.residuo,'Residuo',bs.residuo<0?'var(--neg)':null)}${kpi(bs.dopo,'Dopo obiettivi',bs.dopo<0?'var(--neg)':'var(--pos)')}</div>
  <div class="card"><div class="sec-title">Ripartizione budget · ${esc(t.nome)}</div>${split}<div class="muted small" style="margin-top:6px">Cambia strategia nella sezione <b>Strategia</b>.</div></div>
  <div class="card"><div class="between"><span class="small muted">Gol attesi dagli acquisti</span><span class="num">${goals} <span class="faint">/ ~76</span></span></div>
    <div class="bar ${goals>=76?'ok':''}" style="margin-top:6px"><i style="width:${Math.min(100,Math.round(goals/76*100))}%"></i></div></div>`;
}

/* ---- STRATEGIA ---- */
function viewStrategia(){
  const a=A(),b=a.budget;
  const mods=STRAT.template_budget.map(t=>{const on=t.id===a.module;
    const split=ROLES.map(Rr=>`<span class="tag" style="margin:2px 3px 0 0"><span class="chip ${Rr}" style="width:16px;height:16px;font-size:9px">${Rr}</span> ${Math.round(t.ripartizione_pct[Rr]*b)}</span>`).join('');
    return `<div class="card" style="border-color:${on?'var(--accent)':'var(--border)'};${on?'background:var(--accent-soft)':''}">
      <div class="between"><h3 style="font-size:15px">${esc(t.nome)}</h3>${on?'<span class="tag blue">Attiva</span>':`<button class="btn sm" data-setmod="${t.id}">Usa</button>`}</div>
      <div class="muted small" style="margin:6px 0 10px">${esc(t.quando)}</div><div>${split}</div></div>`;}).join('');
  const comp=STRAT.composizione_rosa.map(c=>`<li><b>${c.min}${c.max!==c.min?'-'+c.max:''}</b> ${esc(c.categoria)} <span class="muted">— ${esc(c.nota)}</span></li>`).join('');
  const err=STRAT.errori_da_evitare.map(e=>`<li>${esc(e)}</li>`).join('');
  const cons=ROLES.map(Rr=>`<div style="margin:10px 0"><div class="small" style="font-weight:600;margin-bottom:4px"><span class="chip ${Rr}">${Rr}</span> ${ROLE_NAME[Rr]}</div>
    <ul class="list-clean muted small" style="margin:0;padding-left:18px">${STRAT.consigli_per_ruolo[Rr].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
  return `<h1 style="font-size:20px;margin-bottom:6px">Strategia</h1>
    <p class="muted small" style="margin-bottom:16px">Scegli il modulo: ricalcola la ripartizione sul budget di ${b} mln.</p>${mods}
    <div class="card"><div class="sec-title">Composizione ideale dei 25</div><ul class="list-clean" style="margin:0;padding-left:20px">${comp}</ul>
      <div class="faint small" style="margin-top:8px">Regola bonus: gol attesi degli 11 titolari ≈ 2 × giornate (~76 su 38).</div></div>
    <div class="card"><div class="sec-title">Consigli per ruolo</div>${cons}</div>
    <div class="card"><div class="sec-title">10 errori da evitare</div><ol class="list-clean muted small" style="margin:0;padding-left:20px">${err}</ol>
      <div class="faint small" style="margin-top:10px">Fonti: Fantacalcio.it, Sky Sport, Fantapazz, Goal, Fantalgoritmo.</div></div>`;
}

/* ================= MODALS ================= */
function openModal(html){$('#modalRoot').innerHTML=`<div class="overlay"><div class="sheet"><div class="grip"></div>${html}</div></div>`;}
function closeModal(){$('#modalRoot').innerHTML='';}
function detailHtml(pid){
  const p=byId[pid];if(!p)return'';const tm=trendMeta(p.trend);const isP=p.r==='P';
  const heads=isP?['G.sub','R.par','Amm']:['Gol','Ass','Rig'];
  const cells=d=>isP?`<td class="num">${d.gs??0}</td><td class="num">${d.rp??0}</td><td class="num">${d.amm??0}</td>`
    :`<td class="num">${d.gf??0}</td><td class="num">${d.ass??0}</td><td class="num">${d.rt?d.rs+'/'+d.rt:'—'}</td>`;
  const strows=SEASONS.map(s=>{const d=p.stats[s];if(!d)return `<tr><td>${s}</td><td colspan="6" class="faint">—</td></tr>`;
    return `<tr><td>${s}</td><td class="num">${d.pv??'—'}</td><td class="num">${d.mv!=null?d.mv.toFixed(2):'—'}</td>
      <td class="num">${d.fm!=null?d.fm.toFixed(2):'—'} ${tierBadge(p.tiers[s])}</td>${cells(d)}</tr>`;}).join('');
  const canAdd=!!A(),inSlot=canAdd&&slotOf(p.id);
  const others=canAdd?A().slots.filter(s=>s.r===p.r&&!s.esito&&!s.cand.some(c=>c.pid===p.id)):[];
  return `<div class="between" style="margin-bottom:4px"><div class="row"><span class="chip ${p.r}" style="width:28px;height:28px;font-size:13px">${p.r}</span>
      <div><h2 style="font-size:19px">${esc(p.nome)}</h2><div class="muted small">${esc(p.sq)} · Mantra: ${esc(p.rm)}</div></div></div>
    <button class="iconbtn" data-act="close">${IC.close}</button></div>
  <div style="margin:10px 0">${flagsHtml(p)||'<span class="faint small">—</span>'}</div>
  <div class="grid4" style="margin:14px 0">
    <div class="kpi"><div class="v num">${p.qtA}</div><div class="l">Quotazione</div></div>
    <div class="kpi"><div class="v num">${p.fvm}</div><div class="l">FVM</div></div>
    <div class="kpi"><div class="v num arrow ${tm.c}">${tm.a}</div><div class="l">${tm.l}</div></div>
    ${canAdd?`<div class="kpi"><div class="v num" style="color:var(--accent)">${cr(suggPct(p))}</div><div class="l">Prezzo consigliato</div></div>`:`<div class="kpi"><div class="v num">${media3(p)?media3(p).toFixed(2):'—'}</div><div class="l">Media 3 stagioni</div></div>`}</div>
  ${seasonChart(p)?`<div class="card" style="padding:14px 12px 8px;margin-bottom:14px">
    <div class="between" style="margin-bottom:4px"><div class="sec-title" style="margin:0">Andamento per stagione</div>
      <div class="small" style="display:flex;gap:10px"><span style="color:#3b82f6">●&nbsp;Fantamedia</span><span style="color:#34d399">●&nbsp;Media voto</span></div></div>
    ${seasonChart(p)}</div>`:''}
  <div class="card" style="padding:8px 12px 4px"><table class="stats"><thead><tr><th>Stag.</th><th>PV</th><th>MV</th><th>FM</th><th>${heads[0]}</th><th>${heads[1]}</th><th>${heads[2]}</th></tr></thead><tbody>${strows}</tbody></table>
    ${p.nSeasons<2?'<div class="faint small" style="padding:8px 2px">Nessuno storico precedente rilevante in Serie A.</div>':''}</div>
  ${canAdd?`<div class="field" style="margin-top:14px"><label for="dnote">Note personali</label>
    <textarea class="input" id="dnote" data-note="${p.id}" placeholder="Appunti, infortuni, ballottaggi…">${esc(A().notes[p.id]||'')}</textarea></div>
  ${inSlot?`<div class="tag blue" style="margin-bottom:10px">Già nei tuoi obiettivi</div>`:
    `<button class="btn primary" data-act="add-obj" data-pid="${p.id}" style="width:100%;margin-bottom:8px">${IC.plus} Salva negli obiettivi</button>`}
  ${(!inSlot&&others.length)?`<div class="field"><label>…oppure come 2ª/3ª scelta di:</label>
    <select class="input" data-addto="${p.id}"><option value="">Scegli un obiettivo</option>
    ${others.map(s=>`<option value="${s.id}">${esc(byId[s.cand[0].pid].nome)}${s.cand.length>1?' +'+(s.cand.length-1):''}</option>`).join('')}</select></div>`:''}`
  :`<div class="faint small" style="margin-top:12px">Apri o crea una PreAsta per salvare questo giocatore tra i tuoi obiettivi.</div>`}`;
}
function openDetail(pid){openModal(detailHtml(pid));}
function pickerHtml(role,slotId){
  return `<div class="between" style="margin-bottom:12px"><h2 style="font-size:17px">2ª / 3ª scelta · ${ROLE_NAME[role]}</h2><button class="iconbtn" data-act="close">${IC.close}</button></div>
    <input class="input" id="pkq" placeholder="Cerca…" data-picker="${role}|${slotId||''}" style="margin-bottom:12px">
    <div class="plist" id="pkrows">${pickerRows(role,'',slotId)}</div>`;}
function pickerRows(role,q,slotId){q=(q||'').toLowerCase();const chosen=new Set();A().slots.forEach(s=>s.cand.forEach(c=>chosen.add(c.pid)));
  const arr=PLAYERS.filter(p=>p.r===role&&!chosen.has(p.id)&&(!q||p.nome.toLowerCase().includes(q)||p.sq.toLowerCase().includes(q))).sort((a,b)=>(b.qtA||0)-(a.qtA||0)).slice(0,60);
  if(!arr.length)return `<div class="empty" style="padding:20px">Nessuno</div>`;
  return arr.map(p=>`<div class="pcard" data-pick="${slotId||''}|${p.id}"><span class="chip ${p.r}">${p.r}</span>
    <div><div class="nm">${esc(p.nome)}</div><div class="mt">${esc(p.sq)}</div></div><div class="push"></div><div class="qt num">${p.qtA}</div><div class="faint small">qt</div></div>`).join('');}
function openAuctionModal(mode){
  const editing=mode==='edit';const a=editing?A():{name:'Asta '+(DB.auctions.length+1),participants:8,budget:500,module:'modificatore_difesa'};
  openModal(`<div class="between" style="margin-bottom:14px"><h2 style="font-size:18px">${editing?'Impostazioni':'Crea PreAsta'}</h2><button class="iconbtn" data-act="close">${IC.close}</button></div>
    <div class="field"><label for="na-n">Nome</label><input class="input" id="na-n" value="${esc(a.name)}" placeholder="Es. Lega amici…"></div>
    <div class="field"><label for="na-p">In quanti siete all'asta?</label><input class="input num" id="na-p" type="number" min="2" max="20" value="${a.participants}"></div>
    <div class="field"><label for="na-b">Budget a disposizione (milioni)</label><input class="input num" id="na-b" type="number" min="1" value="${a.budget}"></div>
    <div class="field"><label for="na-m">Strategia / modulo</label><select class="input" id="na-m">${STRAT.template_budget.map(t=>`<option value="${t.id}" ${a.module===t.id?'selected':''}>${esc(t.nome)}</option>`).join('')}</select></div>
    <div class="faint small" style="margin-bottom:14px">I prezzi restano in percentuale: cambiando budget si ricalcolano da soli.</div>
    <button class="btn primary" data-act="${editing?'save-edit':'save-new'}" style="width:100%">${editing?'Salva':'Crea e apri l\\u0027assistente'}</button>`);}
function readForm(){const n=$('#na-n').value.trim()||'Asta',p=parseInt($('#na-p').value,10),b=parseInt($('#na-b').value,10),m=$('#na-m').value;
  if(isNaN(p)||p<2){alert('Numero partecipanti non valido (min 2)');return null;}if(isNaN(b)||b<1){alert('Budget non valido');return null;}
  return{name:n,participants:p,budget:b,module:m};}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('overlay')){closeModal();return;}
  const t=e.target.closest('[data-tab],[data-act],[data-open],[data-add],[data-setmod],[data-sugg],[data-buy],[data-rmcand],[data-addcand],[data-undo],[data-phase],[data-pick],[data-open-auction],[data-ren],[data-dup],[data-del]');
  if(!t)return;const d=t.dataset;
  if(d.tab){R.tab=d.tab;render();return;}
  if(d.phase){R.phase=d.phase;R.tab='assistente';render();window.scrollTo(0,0);return;}
  if(d.openAuction){R.currentId=d.openAuction;R.tab='assistente';R.phase='P';render();window.scrollTo(0,0);return;}
  if(d.ren){const a=DB.auctions.find(x=>x.id===d.ren);const n=prompt('Nome:',a.name);if(n&&n.trim()){a.name=n.trim();save();render();}return;}
  if(d.dup){const a=DB.auctions.find(x=>x.id===d.dup);const c=JSON.parse(JSON.stringify(a));c.id=uid('a');c.name=a.name+' (copia)';c.createdAt=Date.now();DB.auctions.push(c);save();render();return;}
  if(d.del){const a=DB.auctions.find(x=>x.id===d.del);if(confirm('Eliminare "'+a.name+'"?')){DB.auctions=DB.auctions.filter(x=>x.id!==d.del);if(R.currentId===d.del)R.currentId=null;save();render();}return;}
  const act=d.act;
  if(act==='close'){closeModal();return;}
  if(act==='home'){R.currentId=null;R.home='home';render();return;}
  if(act==='listone'){R.currentId=null;R.home='listone';render();return;}
  if(act==='aste'){R.currentId=null;R.home='aste';render();return;}
  if(act==='open-strategia'){if(DB.auctions.length){R.currentId=DB.auctions[0].id;R.tab='strategia';}else{openAuctionModal('new');}render();return;}
  if(act==='new-auction'){openAuctionModal('new');return;}
  if(act==='edit-auction'){openAuctionModal('edit');return;}
  if(act==='save-new'){const f=readForm();if(!f)return;const a=Object.assign({id:uid('a'),slots:[],notes:{},createdAt:Date.now()},f);DB.auctions.push(a);R.currentId=a.id;R.tab='assistente';R.phase='P';save();closeModal();render();return;}
  if(act==='save-edit'){const f=readForm();if(!f)return;Object.assign(A(),f);save();closeModal();render();return;}
  if(act==='add-obj'){addSlot(+d.pid);closeModal();render();return;}
  if(d.open){openDetail(+d.open);return;}
  if(d.add!=null&&d.add!==''){const pid=+d.add;const sl=slotOf(pid);if(sl)removeCand(sl.id,pid);else addSlot(pid);render();return;}
  if(d.setmod){A().module=d.setmod;save();render();return;}
  if(d.sugg){const[sid,pid]=d.sugg.split('|');const sl=A().slots.find(x=>x.id===sid);const c=sl&&sl.cand.find(x=>x.pid==pid);if(c){c.pct=suggPct(byId[+pid]);save();render();}return;}
  if(d.rmcand){const[sid,pid]=d.rmcand.split('|');removeCand(sid,+pid);render();return;}
  if(d.addcand){openModal(pickerHtml(A().slots.find(x=>x.id===d.addcand).r,d.addcand));return;}
  if(d.undo){const sl=A().slots.find(x=>x.id===d.undo);if(sl){sl.esito=null;save();render();}return;}
  if(d.buy){const[sid,pid]=d.buy.split('|');const sl=A().slots.find(x=>x.id===sid);const c=sl&&sl.cand.find(x=>x.pid==pid);
    const val=prompt('A quanti crediti hai preso '+byId[+pid].nome+'?',c?cr(c.pct):0);
    if(val!==null){const n=parseInt(val,10);if(!isNaN(n)){sl.esito={pid:+pid,prezzo:n};save();render();}}return;}
  if(d.pick!=null){const[sid,pid]=d.pick.split('|');if(sid)addCand(sid,+pid);else addSlot(+pid);closeModal();render();return;}
});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.note!=null){A().notes[el.dataset.note]=el.value;save();return;}
  if(el.dataset.picker!=null){const[role,slotId]=el.dataset.picker.split('|');$('#pkrows').innerHTML=pickerRows(role,el.value,slotId);return;}
  if(el.dataset.price!=null){const n=parseInt(el.value,10);const lbl=el.parentElement.querySelector('.faint');if(lbl&&!isNaN(n)&&budget())lbl.textContent=(n/budget()*100).toFixed(1)+'%';}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.price!=null){const[sid,pid]=el.dataset.price.split('|');const sl=A().slots.find(x=>x.id===sid);const c=sl&&sl.cand.find(x=>x.pid==pid);const n=parseInt(el.value,10);
    if(c&&!isNaN(n)&&budget()){c.pct=n/budget();save();render();}return;}
  if(el.dataset.addto!=null){const pid=+el.dataset.addto,sid=el.value;if(sid){addCand(sid,pid);closeModal();render();}return;}});

render();
})();
</script>
